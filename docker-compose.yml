services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sivorment
      POSTGRES_USER: sivorment
      POSTGRES_PASSWORD: sivorment
    ports:
      - "5432:5432"
    volumes:
      - sivorment_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivorment -d sivorment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sivorment_postgres:
